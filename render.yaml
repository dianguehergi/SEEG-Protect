services:
  - type: web
    name: seeg-protect
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SEEG_PROTECT_HOST
        value: 0.0.0.0
      - key: SEEG_PROTECT_PORT
        value: 8000
      - key: SEEG_PROTECT_DB
        value: /tmp/seeg_protect.sqlite3
      - key: SEEG_PROTECT_EVENT_LOG
        value: /tmp/events.jsonl
      - key: SEEG_PROTECT_SMS_OUTBOX
        value: /tmp/sms_outbox.jsonl
      - key: SEEG_PROTECT_SMS_PROVIDER
        value: stub
      - key: SEEG_PROTECT_WEBHOOK_SECRET
        generateValue: true
      - key: SEEG_PROTECT_ADMIN_TOKEN
        generateValue: true
      - key: MEROE_OWNER_PASSWORD
        generateValue: true
      - key: MEROE_COLLABORATOR_PASSWORD
        generateValue: true
